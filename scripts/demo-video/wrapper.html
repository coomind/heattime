<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HeatTime 활용 영상 녹화 래퍼</title>
<!-- Recording-only page (not part of the app build). The app iframe is 1440x702 CSS px scaled by 4/3 to fill
     1920x936; the 144px band below is reserved for captions so they never cover the app. Framing changes are a
     0.25 s fade between "page top" and "one card with margins" shots. No grain, blur, glow or shadow. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2')}
:root{--bg:#f6f7f3;--ink:#10292a;--muted:#4a5f5d;--line:#d3dbd6}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'IBM Plex Sans KR',sans-serif;color:var(--ink)}
#viewport{position:absolute;left:0;top:0;width:1920px;height:936px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1920px;height:936px;transform-origin:0 0;transition:opacity .25s ease}
#stage.out{opacity:0}
.mask{position:absolute;background:var(--bg);display:none;z-index:5}
body.masked .mask{display:block}
.app{position:absolute;left:0;top:0;width:1440px;height:702px;border:0;transform:scale(1.333333);transform-origin:0 0;background:var(--bg)}
#phone{position:absolute;display:none;left:calc(50% - 275px);top:24px;width:526px;height:864px;border:12px solid #10292a;border-radius:48px;overflow:hidden;background:#fff}
#phone iframe{position:absolute;left:0;top:0;width:390px;height:640px;border:0;transform:scale(1.35);transform-origin:0 0}
body.phone #phone{display:block}
#pdf{position:absolute;display:none;left:50%;top:20px;height:896px;transform:translateX(-50%);border:1px solid var(--line);background:#fff}
body.pdf #pdf{display:block}
.hidden{visibility:hidden}
#band{position:absolute;left:0;top:936px;width:1920px;height:144px;border-top:1px solid var(--line);box-sizing:border-box;background:var(--bg)}
#cap{position:absolute;left:200px;top:26px;right:420px;transition:opacity .25s ease}
#cap.out{opacity:0}
#chip{position:absolute;left:-120px;top:10px;font:500 16px 'IBM Plex Mono',monospace;color:var(--muted);white-space:nowrap}
#big{font-weight:700;font-size:40px;line-height:52px;white-space:nowrap;overflow:hidden}
#small{font-size:22px;line-height:34px;color:var(--muted);white-space:nowrap;overflow:hidden}
#fixed{position:absolute;right:60px;top:58px;font-family:'IBM Plex Sans KR',sans-serif;font-size:17px;color:var(--muted)}
#cursor{position:absolute;left:1500px;top:700px;width:28px;height:36px;pointer-events:none;z-index:10;transition:left .6s ease-in-out,top .6s ease-in-out,transform .15s ease;transform-origin:2px 2px}
#cursor.press{transform:scale(.85)}
</style>
</head>
<body>
<div id="viewport">
 <div id="stage">
  <iframe id="app" class="app" title="HeatTime 정적 시연판"></iframe>
  <iframe id="app2" class="app hidden" title="HeatTime 정적 시연판(두 번째 장면)"></iframe>
  <div id="phone"><iframe id="team" title="참가팀 읽기 전용 일정"></iframe></div>
  <img id="pdf" alt="운영 기록 PDF 첫 페이지">
 </div>
 <div class="mask" id="m1"></div><div class="mask" id="m2"></div><div class="mask" id="m3"></div><div class="mask" id="m4"></div>
</div>
<svg id="cursor" viewBox="0 0 28 36" aria-hidden="true"><path d="M2 2 L2 29 L9 22.5 L13.6 33 L18.2 31 L13.7 20.8 L23 20.8 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
<div id="band">
 <div id="cap"><span id="chip"></span><div id="big"></div><div id="small"></div></div>
 <div id="fixed">가상 대회의 추정값입니다</div>
</div>
<script>
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
window.rec={
 caption(n,total,big,small){const c=$('cap');c.classList.add('out');
  return wait(250).then(()=>{$('chip').textContent=String(n).padStart(2,'0')+' / '+String(total).padStart(2,'0');$('big').textContent=big;$('small').textContent=small;c.classList.remove('out');return wait(250);});},
 move(x,y){const c=$('cursor');c.style.left=x+'px';c.style.top=y+'px';return wait(600);},
 press(){const c=$('cursor');c.classList.add('press');return wait(150).then(()=>{c.classList.remove('press');return wait(150);});},
 // Stage framing: s and (tx,ty) map stage px to screen px. Changing it is a cut hidden by a 0.25 s fade.
 fadeOut(){$('stage').classList.add('out');return wait(260);},
 fadeIn(){$('stage').classList.remove('out');return wait(260);},
 frame(s,tx,ty){$('viewport').scrollTop=0;$('viewport').scrollLeft=0;$('stage').style.transform=`translate(${tx}px,${ty}px) scale(${s})`;},
 show(which){for(const id of ['app','app2'])$(id).classList.toggle('hidden',id!==which);document.body.classList.toggle('phone',which==='team');document.body.classList.toggle('pdf',which==='pdf');
  if(which==='team'||which==='pdf')for(const id of ['app','app2'])$(id).classList.add('hidden');},
 // Plain background-colour panels outside the framed card, so only that card shows (no dimming or blur).
 mask(x,y,w,h){const set=(id,l,t,ww,hh)=>Object.assign($(id).style,{left:l+'px',top:t+'px',width:Math.max(0,ww)+'px',height:Math.max(0,hh)+'px'});
  set('m1',0,0,1920,y);set('m2',0,y+h,1920,936-y-h);set('m3',0,y,x,h);set('m4',x+w,y,1920-x-w,h);document.body.classList.add('masked');},
 unmask(){document.body.classList.remove('masked');},
 cursorVisible(v){$('cursor').style.visibility=v?'visible':'hidden';},
};
const q=new URLSearchParams(location.search);
$('app').src=q.get('app');if(q.get('pdf'))$('pdf').src=q.get('pdf');
</script>
</body>
</html>
